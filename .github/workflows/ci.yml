name: CI

# Sur chaque pull request : la banque de questions est validée, les tests
# passent et l'app compile. Un JSON mal formé ne peut donc pas être mergé.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Valider les questions
        run: npm run validate
      - run: npm test
      - run: npm run build
